name: Build MUSIC ONE APK

on:
  push:
    paths:
      - "MUSIC_ONE_Android_Starter_v0.19.0.zip"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          test -f MUSIC_ONE_Android_Starter_v0.19.0.zip
          unzip -q MUSIC_ONE_Android_Starter_v0.19.0.zip -d .
          test -f music_one/app/build.gradle.kts
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        working-directory: music_one
        run: gradle :app:testDebugUnitTest
      - name: Assemble debug APK
        working-directory: music_one
        run: gradle :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-one-debug-apk
          path: music_one/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
