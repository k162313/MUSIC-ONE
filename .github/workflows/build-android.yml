name: Build MUSIC ONE APK

on:
  push:
    paths:
      - "MUSIC_ONE_Android_Starter_v0.19.0.zip"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Unpack Android project
        run: |
          test -f MUSIC_ONE_Android_Starter_v0.19.0.zip
          unzip -q MUSIC_ONE_Android_Starter_v0.19.0.zip -d .
          test -f music_one/app/build.gradle.kts
      - name: Patch Kotlin compile errors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          main = Path("music_one/app/src/main/java/com/musicone/app/MainActivity.kt")
          text = main.read_text()
          text = text.replace("import androidx.compose.foundation.background", "import androidx.compose.animation.core.animateFloat\nimport androidx.compose.foundation.background")
          text = text.replace("playSavedTrack(saved, tracks, onPlayTrack)", "onPlaySavedTrack(saved)")
          main.write_text(text)
          source = Path("music_one/app/src/main/java/com/musicone/app/SourceManager.kt")
          text = source.read_text()
          text = text.replace("        buildList {\n            for (i in 0 until minOf(array.length(), 100)) {", "        return buildList {\n            for (i in 0 until minOf(array.length(), 100)) {")
          source.write_text(text)
          library = Path("music_one/app/src/main/java/com/musicone/app/LibraryData.kt")
          text = library.read_text()
          text = text.replace("    private fun List<SavedTrack>.toJson()", '    @JvmName("savedTracksToJson")\n    private fun List<SavedTrack>.toJson()')
          text = text.replace("    private fun List<MusicPlaylist>.toJson()", '    @JvmName("playlistsToJson")\n    private fun List<MusicPlaylist>.toJson()')
          library.write_text(text)
          PY
      - name: Align Java and Kotlin JVM targets
        run: |
          cat >> music_one/app/build.gradle.kts <<'EOF'

          tasks.withType<JavaCompile>().configureEach {
              sourceCompatibility = "17"
              targetCompatibility = "17"
          }

          tasks.withType<org.jetbrains.kotlin.gradle.tasks.KotlinCompile>().configureEach {
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Run unit tests
        working-directory: music_one
        run: gradle -Pkotlin.jvm.target.validation.mode=warning :app:testDebugUnitTest
      - name: Assemble debug APK
        working-directory: music_one
        run: gradle -Pkotlin.jvm.target.validation.mode=warning :app:assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: music-one-debug-apk
          path: music_one/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
